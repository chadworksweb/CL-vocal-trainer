# Inside the vt-static container. Serves the static PWA on port 80; le-nginx
# terminates TLS and reverse-proxies here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Force the correct manifest MIME regardless of the base mime.types.
    location = /manifest.webmanifest { default_type application/manifest+json; }

    # Never cache the entry document or the worker, so a reload always shows the
    # latest version (no service worker or CDN copy standing in the way).
    location = / { add_header Cache-Control "no-store" always; try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-store" always; }
    location = /sw.js { add_header Cache-Control "no-store" always; }

    location / { try_files $uri $uri/ =404; }
}
