# vt.chadlewine.com -> vt-static container (le-proxy). CL Vocal Trainer: a
# standalone static PWA with its own repo/container. Served over HTTPS so the
# mic (getUserMedia, secure-context only) works. LE cert via the shared certbot
# webroot (/var/www/certbot). Installed on the droplet at
# /root/proxy/nginx/conf.d/vt.chadlewine.conf. Modeled on chadlewine.conf.

server {
    listen 80;
    listen [::]:80;
    server_name vt.chadlewine.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://vt.chadlewine.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vt.chadlewine.com;

    ssl_certificate /etc/letsencrypt/live/vt.chadlewine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vt.chadlewine.com/privkey.pem;
    include /etc/nginx/ssl-common.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://vt-static:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
